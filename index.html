<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>งานวันนี้</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chonburi&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #eef1f6;
      --sheet: #ffffff;
      --ink: #1c2a6b;
      --ink-soft: #5b6699;
      --line: #d7dcea;
      --marker: #ffe14d;
      --danger: #c2352b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: "IBM Plex Sans Thai", system-ui, sans-serif;
      font-size: 17px;
      line-height: 1.6;
      padding: 56px 16px 80px;
    }

    .sheet {
      max-width: 560px;
      margin: 0 auto;
      background: var(--sheet);
      border-radius: 4px 28px 4px 4px;
      padding: 40px 36px 28px;
      box-shadow: 0 1px 0 var(--line), 0 24px 48px -28px rgba(28, 42, 107, 0.35);
    }

    /* ส่วนหัว: วันที่ตัวใหญ่ */
    .day {
      font-family: "Chonburi", serif;
      font-size: clamp(2.4rem, 8vw, 3.4rem);
      line-height: 1.15;
      margin: 0;
      letter-spacing: -0.01em;
    }
    .date {
      margin: 6px 0 0;
      color: var(--ink-soft);
    }

    .progress {
      margin: 28px 0 8px;
      height: 6px;
      background: var(--line);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--ink);
      transition: width 0.4s ease;
    }
    .summary { margin: 0; font-size: 0.95rem; color: var(--ink-soft); }

    /* ช่องเพิ่มงาน */
    form {
      display: flex;
      gap: 12px;
      margin: 32px 0 8px;
      border-bottom: 2px solid var(--ink);
    }
    #todo-input {
      flex: 1;
      min-width: 0;
      border: none;
      background: transparent;
      font: inherit;
      font-size: 1.1rem;
      color: var(--ink);
      padding: 10px 0;
      outline: none;
    }
    #todo-input::placeholder { color: #9aa2c4; }
    .add {
      border: none;
      background: var(--ink);
      color: #fff;
      font: inherit;
      font-weight: 600;
      padding: 6px 18px;
      margin: 6px 0;
      border-radius: 999px;
      cursor: pointer;
    }
    .add:hover { background: #2b3c8f; }

    /* ตัวกรอง */
    .filters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      margin: 20px 0 4px;
    }
    .filters button {
      border: none;
      background: none;
      font: inherit;
      font-size: 0.95rem;
      color: var(--ink-soft);
      padding: 4px 12px;
      border-radius: 999px;
      cursor: pointer;
    }
    .filters button[aria-pressed="true"] {
      background: var(--paper);
      color: var(--ink);
      font-weight: 600;
    }
    .filters .clear { margin-left: auto; }
    .filters .clear:hover { color: var(--danger); }

    /* รายการ */
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }
    li:last-child { border-bottom: none; }

    .check {
      appearance: none;
      flex: none;
      width: 24px;
      height: 24px;
      margin: 0;
      border: 2px solid var(--ink);
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-content: center;
    }
    .check::after {
      content: "";
      width: 10px;
      height: 6px;
      border-left: 2.5px solid #fff;
      border-bottom: 2.5px solid #fff;
      transform: rotate(-45deg) translate(1px, -1px) scale(0);
      transition: transform 0.15s ease;
    }
    .check:checked { background: var(--ink); }
    .check:checked::after { transform: rotate(-45deg) translate(1px, -1px) scale(1); }

    /* ข้อความ + ปากกาไฮไลต์ตอนติ๊กเสร็จ */
    .text {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .text mark {
      background: linear-gradient(transparent 55%, var(--marker) 55%, var(--marker) 92%, transparent 92%) no-repeat;
      background-size: 0% 100%;
      color: inherit;
      transition: background-size 0.45s ease, color 0.3s ease;
    }
    li.done .text mark {
      background-size: 100% 100%;
      color: var(--ink-soft);
    }

    .delete {
      flex: none;
      border: none;
      background: none;
      color: var(--ink-soft);
      font-size: 1.4rem;
      line-height: 1;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      opacity: 0;
    }
    li:hover .delete, .delete:focus-visible { opacity: 1; }
    .delete:hover { color: var(--danger); background: #fbeceb; }
    @media (hover: none) { .delete { opacity: 1; } }

    .empty {
      display: block;
      text-align: center;
      color: var(--ink-soft);
      padding: 36px 0 20px;
      border: none;
    }

    :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

    @media (max-width: 480px) {
      body { padding-top: 24px; }
      .sheet { padding: 28px 20px 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="sheet">
    <header>
      <h1 class="day" id="day"></h1>
      <p class="date" id="date"></p>
      <div class="progress" aria-hidden="true"><span id="bar"></span></div>
      <p class="summary" id="summary"></p>
    </header>

    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="วันนี้ต้องทำอะไรบ้าง" autocomplete="off" aria-label="งานใหม่">
      <button type="submit" class="add">เพิ่มงาน</button>
    </form>

    <div class="filters" role="group" aria-label="แสดงงาน">
      <button type="button" data-filter="all" aria-pressed="true">ทั้งหมด</button>
      <button type="button" data-filter="active" aria-pressed="false">ยังไม่เสร็จ</button>
      <button type="button" data-filter="done" aria-pressed="false">เสร็จแล้ว</button>
      <button type="button" class="clear" id="clear">ล้างงานที่เสร็จ</button>
    </div>

    <ul id="todo-list"></ul>
  </main>

  <script>
    const form = document.getElementById('todo-form');
    const input = document.getElementById('todo-input');
    const list = document.getElementById('todo-list');
    const filterButtons = document.querySelectorAll('[data-filter]');

    // เก็บข้อมูลไว้ใน localStorage ของเบราว์เซอร์
    let todos = JSON.parse(localStorage.getItem('todos') || '[]');
    let filter = 'all';

    // หัวกระดาษเป็นวันที่ของวันนี้
    const now = new Date();
    document.getElementById('day').textContent =
      now.toLocaleDateString('th-TH', { weekday: 'long' });
    document.getElementById('date').textContent =
      now.toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: 'numeric' });

    function save() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    function renderSummary() {
      const total = todos.length;
      const done = todos.filter(t => t.done).length;
      const left = total - done;
      document.getElementById('bar').style.width = total ? (done / total * 100) + '%' : '0';
      document.getElementById('summary').textContent =
        total === 0 ? 'ยังไม่มีงาน'
        : left === 0 ? `เสร็จครบทั้ง ${total} งานแล้ว`
        : `เหลืออีก ${left} จาก ${total} งาน`;
      document.getElementById('clear').hidden = done === 0;
    }

    function render() {
      renderSummary();
      list.innerHTML = '';

      const visible = todos
        .map((todo, index) => ({ todo, index }))
        .filter(({ todo }) =>
          filter === 'all' || (filter === 'done' ? todo.done : !todo.done));

      if (visible.length === 0) {
        const empty = document.createElement('li');
        empty.className = 'empty';
        empty.textContent =
          todos.length === 0 ? 'พิมพ์งานแรกของวันในช่องด้านบน'
          : filter === 'done' ? 'ยังไม่มีงานที่เสร็จ'
          : 'ไม่มีงานค้างแล้ว';
        list.appendChild(empty);
        return;
      }

      visible.forEach(({ todo, index }) => {
        const li = document.createElement('li');
        if (todo.done) li.classList.add('done');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'check';
        checkbox.checked = todo.done;
        checkbox.setAttribute('aria-label', `ทำเสร็จแล้ว: ${todo.text}`);
        checkbox.addEventListener('change', () => {
          todos[index].done = checkbox.checked;
          li.classList.toggle('done', checkbox.checked);
          save();
          renderSummary();
          // รอให้ปากกาไฮไลต์วิ่งเสร็จก่อน ค่อยซ่อนรายการถ้ากำลังกรองอยู่
          if (filter !== 'all') setTimeout(render, 500);
        });

        const text = document.createElement('span');
        text.className = 'text';
        const mark = document.createElement('mark');
        mark.textContent = todo.text;
        text.appendChild(mark);

        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'delete';
        del.textContent = '×';
        del.setAttribute('aria-label', `ลบ ${todo.text}`);
        del.addEventListener('click', () => {
          todos.splice(index, 1);
          save();
          render();
        });

        li.append(checkbox, text, del);
        list.appendChild(li);
      });
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      todos.push({ text, done: false });
      input.value = '';
      save();
      render();
    });

    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filter = btn.dataset.filter;
        filterButtons.forEach(b => b.setAttribute('aria-pressed', b === btn));
        render();
      });
    });

    document.getElementById('clear').addEventListener('click', () => {
      todos = todos.filter(t => !t.done);
      save();
      render();
    });

    render();
  </script>
</body>
</html>
